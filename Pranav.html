<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Web Page</title>
    <style>
        /* Basic styling to make the demo look clean */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        header {
            background: #333;
            color: #fff;
            padding: 10px 20px;
            text-align: center;
        }
        nav a {
            color: #333;
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            background: #fff;
            padding: 20px;
            margin-top: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 3px;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Demo Site</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <h2>About This Page</h2>
        <p>This is a starter <strong>HTML5</strong> template. It demonstrates how headings, paragraphs, and styles work together to create a functional interface.</p>
        
        <h3>Interactive Element</h3>
        <p>Click the button below to trigger a basic JavaScript alert.</p>
        <button onclick="showAlert()">Click Me</button>
    </main>

    <script>
        // Simple JavaScript function for the button click
        function showAlert() {
            alert("Hello! This is a demo HTML alert.");
        }
    </script>

</body>
</html>
